name: CI
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:legacy
      - run: npm run test:web
      - run: npm run build:production
      - name: Workspace filesystem and MCP integration
        if: runner.os != 'Windows'
        run: node --test workspace/test/*.test.mjs
